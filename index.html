 const p=sub2(b.t,`<div style="text-align:center"><div style="width:150px;margin:0 auto 14px">${cover(b)}</div><div style="color:var(--mut);font-size:14px">NCERT Publication · Class ${b.k} · ${b.m==='H'?'Hindi':'English'} Medium</div><button class="btn" id="sv" style="margin:16px auto 0;display:block"></button></div><div class="lbl" style="margin-top:26px">Chapters</div><div class="list">${Array.from({length:b.n},(_,i)=>`<button class="li ch">CH-${i+1}: ${b.e==='Accountancy Part I'&&i<6?ACC[i]:(b.e+' · Chapter '+(i+1))}${PDF}</button>`).join('')}</div>`);
 const B=p.querySelector('#sv');const u=()=>{B.textContent=sv()?'✓ Saved in My Books':'Save in My Books';B.style.background=sv()?'#059669':'var(--ac)';B.style.color='#fff'};u();

function nameP(pre){app.innerHTML=`<div class="page center"><div class="logo"><img src="logo.jpg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'S'}))"></div><div class="serif big">Welcome</div><div class="rb serif big" style="font-style:italic">my friend</div><p style="color:var(--mut);margin:14px 0 0;font-size:17px">please enter your name to begin</p>
<div class="inw"><input class="in" id="n" type="text" placeholder="Your name" maxlength="24" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done"><button class="clr" id="clr" hidden aria-label="Clear name">×</button></div><button class="btn" id="go" disabled>Continue</button><div class="foot serif">I ❤️ learning</div></div>`;
 const n=$('#n'),g=$('#go'),c=$('#clr');const up=()=>{g.disabled=!n.value.trim();c.hidden=!n.value};n.value=pre||'';up();n.oninput=up;

 const go=()=>{if(!n.value.trim())return;st.name=n.value.trim();S.set('name',st.name);route()};g.onclick=go;n.onkeydown=e=>{if(e.key==='Enter')go()}}
function clsP(){app.innerHTML=`<div class="page center"><button class="back" id="bk" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;vertical-align:-4px"><path d="M15 5l-7 7 7 7"/></svg> Change name</button><div class="serif" style="font-size:30px">Hii</div><div class="rb serif big" style="font-style:italic;word-break:break-word">${esc(st.name)}</div><p style="font-size:19px;font-weight:700;margin:12px 0 0">Which class are you in?</p><p style="color:var(--mut);margin:6px 0 0">Pick one and we'll set up your books.</p>
<div class="chips">${[6,7,8,9,10,11,12].map(c=>`<button class="chip" data-c="${c}"><small>Class</small><br><b style="font-size:22px">${c}</b></button>`).join('')}</div><button class="btn" id="go" disabled>Start learning</button><div class="foot serif">love reading</div></div>`;

function shell(){app.innerHTML=`<div id="view"></div><div class="nav">${[['home','Home'],['explore','Explore'],['game','Game Zone'],['book','My Books']].map(([k,l])=>`<button class="tab" data-t="${k}">${ic(k)}${l}</button>`).join('')}</div>`;
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{const same=st.tab===t.dataset.t&&!app.querySelector(':scope>.ov');closeAll();if(same){const pg=$('#view .page');pg&&pg.scrollTo({top:0});return}st.tab=t.dataset.t;S.set('tab',st.tab);view()});view()}
function view(){clearInterval(timer);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===st.tab));

  ${contSec()}<h4 class="hd">Books for ${st.cls}<button data-all="1">See all</button></h4>${row(BOOKS.filter(b=>b.k===cn&&b.m==='E'))}<h4>Hindi medium</h4>${row(BOOKS.filter(b=>b.k===cn&&b.m==='H'))}<h4>Popular this week</h4>${row(BOOKS.filter((b,i)=>i%9===0))}${ftr()}</div>`}
 else if(st.tab==='explore')h=`<div class="page">${hdr()}<h3 class="pt">Explore</h3><div class="search">${ic('search').replace('<svg','<svg style="width:20px;height:20px;stroke:var(--mut)"')}<input id="q" placeholder="Search by book title, subject or class"></div><div class="hs" style="margin:12px 0">${['All',6,7,8,9,10,11,12].map(c=>`<button class="fc ${st.f==c?'on':''}" data-f="${c}">${c==='All'?'All':'Class '+c}</button>`).join('')}</div><p class="sub" id="cnt"></p><div class="grid" id="res"></div>${ftr()}</div>`;
 else if(st.tab==='game')h=`<div class="page">${hdr()}<h3 class="pt">Game Zone</h3><div class="empty serif" style="font-size:26px">Games are coming soon.<p class="sub" style="font-family:Manrope;font-size:14px">Quizzes and puzzles will land here.</p></div></div>`;
 else{const sv=saved().map(i=>BOOKS[i]),c=cont(),pg=prog();h=`<div class="page">${hdr()}<h3 class="pt">My Books</h3>
  <h4 style="margin-top:6px">Continue reading</h4>${c.length?`<div class="cgrid">${c.map(id=>{const b=BOOKS[id],d=pg[id]||0,pc=Math.round(d/b.n*100);return`<div class="cb" data-b="${id}"><div class="cbc">${cover(b)}</div><div class="cbi"><b>${b.t}</b><span>Class ${b.k} · ${b.m==='H'?'Hindi':'English'} Medium</span><span>${d?'Chapter '+d+' of '+b.n:'Not started yet'}</span><div class="pb"><i style="width:${pc}%"></i></div><div class="cbf"><em>${pc}% done</em><button class="rs">${d?'Resume':'Start'}</button></div></div><button class="x" data-x="${id}" aria-label="Remove">×</button></div>`}).join('')}</div>`:'<div class="note">Books you open will show up here.</div>'}
  <h4>Saved books</h4>${sv.length?`<div class="grid">${sv.map(card).join('')}</div>`:'<div class="note">Nothing saved yet. Open any book and tap Save in My Books.</div>'}

 v.innerHTML=h;v.onclick=e=>{const x=e.target.closest('[data-x]');if(x){S.set('cont',JSON.stringify(cont().filter(i=>i!==+x.dataset.x)));const pg=$('#view .page'),y=pg.scrollTop;view();$('#view .page').scrollTop=y;return}if(e.target.closest('[data-all]')){st.f=String(cn);st.tab='explore';S.set('tab','explore');shell();return}const c=e.target.closest('[data-b]');if(c)bookP(+c.dataset.b)};
 v.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>b.dataset.a==='sub'?sub():b.dataset.a==='note'?toast('No new notifications'):settings());
 if(st.tab==='home'){let i=0;const s=v.querySelectorAll('.slide'),d=v.querySelectorAll('.dots i');timer=setInterval(()=>{s[i].classList.remove('on');d[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on');d[i].classList.add('on')},2000)}
 if(st.tab==='explore'){v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;view()});const r=()=>{const q=$('#q').value.toLowerCase();const l=BOOKS.filter(b=>(st.f==='All'||b.k==st.f)&&(b.t+b.e+' class '+b.k).toLowerCase().includes(q));$('#cnt').textContent=l.length+' books';$('#res').innerHTML=l.map(card).join('')||'<div class="empty" style="grid-column:1/-1">No books found</div>'};$('#q').oninput=r;r()}}
